[package]
name = "pioneer-console"
version = "0.9.0"
description = "Pioneer desktop console"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pioneer_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Desktop only: there is no second instance to guard against on mobile, and the
# plugin does not build there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source rather than linking the system one, so
# the packaged app does not depend on what the target machine happens to ship.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
