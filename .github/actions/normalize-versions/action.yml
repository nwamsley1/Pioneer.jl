name: "Normalize Versions"
description: "Outputs shared install identity plus Debian, macOS, and Windows-safe versions."
inputs:
  raw:
    description: "Raw version/tag (e.g., v1.2.3, v1.2.3-rc.1, 1.2.3+build)"
    required: true
    type: string
outputs:
  install_key:
    description: "Stable filesystem-safe identity for side-by-side installs"
    value: ${{ steps.mk.outputs.install_key }}
  package_suffix:
    description: "Lowercase package-name suffix for versioned Linux packages"
    value: ${{ steps.mk.outputs.package_suffix }}
  alt_priority:
    description: "Numeric priority used by Linux update-alternatives"
    value: ${{ steps.mk.outputs.alt_priority }}
  deb:
    description: "Debian-safe version"
    value: ${{ steps.mk.outputs.deb }}
  pkg:
    description: "macOS pkgbuild-safe version (x.y.z)"
    value: ${{ steps.mk.outputs.pkg }}
  msi:
    description: "MSI-safe version (x.y.z[.w])"
    value: ${{ steps.mk.outputs.msi }}
  bundle_base:
    description: "Three-field numeric base used for the Windows Burn bundle"
    value: ${{ steps.mk.outputs.bundle_base }}
runs:
  using: "composite"
  steps:
    - id: mk
      shell: bash
      run: |
        RAW="${{ inputs.raw }}"
        # strip leading v/V and drop +build metadata
        CLEAN="${RAW#[vV]}"
        CLEAN="${CLEAN%%+*}"

        # This key defines installation identity on every platform: rebuilding
        # the same raw version returns the same key, while another release or
        # prerelease gets an independent package/directory. Keep it conservative
        # so it is valid in paths, reverse-DNS identifiers, and package names.
        INSTALL_KEY=$(printf '%s' "$CLEAN" \
          | tr '[:upper:]' '[:lower:]' \
          | sed -E 's/[^a-z0-9.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
        if [[ -z "$INSTALL_KEY" ]]; then
          echo "ERROR: raw version '$RAW' does not produce a usable install key" >&2
          exit 1
        fi
        PACKAGE_SUFFIX=${INSTALL_KEY//./-}

        # ---- Dev builds: derive installer-safe numeric versions from timestamp ----
        if [[ "$CLEAN" =~ ^[dD][eE][vV]-([0-9]{14})$ ]]; then
          TS="${BASH_REMATCH[1]}"
          YEAR="${TS:0:4}"
          MONTH="${TS:4:2}"
          DAY="${TS:6:2}"
          HOUR="${TS:8:2}"
          MINUTE="${TS:10:2}"
          SECOND="${TS:12:2}"

          # Debian supports explicit prerelease markers with '~'
          DEB="0.0.0~dev.${TS}"

          # pkgbuild requires numeric dotted version; use stable timestamp-derived encoding
          PKG="0.$((10#$YEAR - 2000)).$((10#$MONTH * 10000 + 10#$DAY * 100 + 10#$HOUR))"

          # MSI allows x.y.z[.w]; keep fields bounded and numeric.
          MSI="1.$((10#$YEAR - 2000)).$((10#$MONTH * 1000 + 10#$DAY * 24 + 10#$HOUR)).$((10#$MINUTE * 60 + 10#$SECOND))"
          BUNDLE_BASE=$(cut -d. -f1-3 <<< "$MSI")

          {
            echo "install_key=$INSTALL_KEY"
            echo "package_suffix=$PACKAGE_SUFFIX"
            echo "alt_priority=1"
            echo "deb=$DEB"
            echo "pkg=$PKG"
            echo "msi=$MSI"
            echo "bundle_base=$BUNDLE_BASE"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        BASE="${CLEAN%%-*}"   # before any -pre
        PRE="${CLEAN#*-}"
        HAS_PRE=0; [[ "$CLEAN" == *-* ]] && HAS_PRE=1

        # ---- Debian: allow prerelease using ~, hyphens -> dots in pre ----
        if [[ $HAS_PRE -eq 1 ]]; then
          PRE_CLEAN=${PRE//-/.}
          DEB="${BASE}~${PRE_CLEAN}"
        else
          DEB="${BASE}"
        fi
        [[ "$DEB" =~ ^[0-9] ]] || DEB="0.0.0"

        # ---- macOS pkg: numeric dotted, up to 3 parts (x.y.z) ----
        PKG="$BASE"
        IFS='.' read -r -a parts <<< "$PKG"
        nums=(); ok=1
        for p in "${parts[@]}"; do
          [[ "$p" =~ ^[0-9]+$ ]] && nums+=("$p") || { ok=0; break; }
        done
        if [[ $ok -eq 0 || ${#nums[@]} -eq 0 ]]; then
          PKG="0.0.0"
        else
          while [[ ${#nums[@]} -lt 3 ]]; do nums+=("0"); done
          [[ ${#nums[@]} -gt 3 ]] && nums=("${nums[@]:0:3}")
          PKG="$(IFS=.; echo "${nums[*]}")"
        fi

        # ---- MSI: numeric dotted, 3–4 parts ----
        IFS='.' read -r -a mparts <<< "$BASE"
        mnums=(); mok=1
        for p in "${mparts[@]}"; do
          [[ "$p" =~ ^[0-9]+$ ]] && mnums+=("$p") || { mok=0; break; }
        done
        if [[ $mok -eq 0 || ${#mnums[@]} -eq 0 ]]; then
          MSI="0.0.0"
        else
          while [[ ${#mnums[@]} -lt 3 ]]; do mnums+=("0"); done
          [[ ${#mnums[@]} -gt 4 ]] && mnums=("${mnums[@]:0:4}")
          MSI="$(IFS=.; echo "${mnums[*]}")"
        fi

        BUNDLE_BASE=$(cut -d. -f1-3 <<< "$MSI")

        # update-alternatives selects the greatest priority in auto mode. A
        # release outranks dev builds, and normal semantic versions retain
        # major/minor/patch ordering for the versions Pioneer publishes.
        IFS='.' read -r PRIORITY_MAJOR PRIORITY_MINOR PRIORITY_PATCH <<< "$PKG"
        ALT_PRIORITY=$((10#$PRIORITY_MAJOR * 1000000 + 10#$PRIORITY_MINOR * 1000 + 10#$PRIORITY_PATCH + 10))
        [[ $HAS_PRE -eq 1 ]] && ALT_PRIORITY=$((ALT_PRIORITY - 1))
        if (( ALT_PRIORITY > 2147483647 )); then
          ALT_PRIORITY=2147483647
        fi

        {
          echo "install_key=$INSTALL_KEY"
          echo "package_suffix=$PACKAGE_SUFFIX"
          echo "alt_priority=$ALT_PRIORITY"
          echo "deb=$DEB"
          echo "pkg=$PKG"
          echo "msi=$MSI"
          echo "bundle_base=$BUNDLE_BASE"
        } >> "$GITHUB_OUTPUT"
