name: Tests

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  installer_metadata:
    name: Installer version identities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Normalize release candidate
        id: release
        uses: ./.github/actions/normalize-versions
        with:
          raw: v2.10.3-rc.1

      - name: Normalize development build
        id: dev
        uses: ./.github/actions/normalize-versions
        with:
          raw: dev-20260817123456

      - name: Verify stable cross-platform identities
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.release.outputs.install_key }}' == '2.10.3-rc.1' ]]
          [[ '${{ steps.release.outputs.package_suffix }}' == '2-10-3-rc-1' ]]
          [[ '${{ steps.release.outputs.deb }}' == '2.10.3~rc.1' ]]
          [[ '${{ steps.release.outputs.pkg }}' == '2.10.3' ]]
          [[ '${{ steps.release.outputs.msi }}' == '2.10.3' ]]
          [[ '${{ steps.release.outputs.bundle_base }}' == '2.10.3' ]]
          [[ '${{ steps.release.outputs.alt_priority }}' == '2010012' ]]

          [[ '${{ steps.dev.outputs.install_key }}' == 'dev-20260817123456' ]]
          [[ '${{ steps.dev.outputs.package_suffix }}' == 'dev-20260817123456' ]]
          [[ '${{ steps.dev.outputs.deb }}' == '0.0.0~dev.20260817123456' ]]
          [[ '${{ steps.dev.outputs.pkg }}' == '0.26.81712' ]]
          [[ '${{ steps.dev.outputs.msi }}' == '1.26.8420.2096' ]]
          [[ '${{ steps.dev.outputs.bundle_base }}' == '1.26.8420' ]]
          [[ '${{ steps.dev.outputs.alt_priority }}' == '1' ]]

  windows_installer_ids:
    name: Windows installer identities
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Generate first 2.1.0 identity
        id: first
        shell: pwsh
        run: .\scripts\windows_installer_ids.ps1 -InstallKey 2.1.0

      - name: Regenerate 2.1.0 identity
        id: same
        shell: pwsh
        run: .\scripts\windows_installer_ids.ps1 -InstallKey 2.1.0

      - name: Generate 2.2.0 identity
        id: other
        shell: pwsh
        run: .\scripts\windows_installer_ids.ps1 -InstallKey 2.2.0

      - name: Verify replacement and side-by-side families
        shell: pwsh
        run: |
          if ('${{ steps.first.outputs.msi_upgrade_code }}' -ne '${{ steps.same.outputs.msi_upgrade_code }}') {
            throw 'The same Pioneer version did not retain its MSI upgrade family'
          }
          if ('${{ steps.first.outputs.bundle_upgrade_code }}' -ne '${{ steps.same.outputs.bundle_upgrade_code }}') {
            throw 'The same Pioneer version did not retain its Burn upgrade family'
          }
          if ('${{ steps.first.outputs.msi_upgrade_code }}' -eq '${{ steps.other.outputs.msi_upgrade_code }}') {
            throw 'Different Pioneer versions share an MSI upgrade family'
          }
          if ('${{ steps.first.outputs.bundle_upgrade_code }}' -eq '${{ steps.other.outputs.bundle_upgrade_code }}') {
            throw 'Different Pioneer versions share a Burn upgrade family'
          }
          if ('${{ steps.first.outputs.desktop_shortcut_component_guid }}' -ne '${{ steps.same.outputs.desktop_shortcut_component_guid }}') {
            throw 'The same Pioneer version did not retain its desktop shortcut component identity'
          }
          if ('${{ steps.first.outputs.desktop_shortcut_component_guid }}' -eq '${{ steps.other.outputs.desktop_shortcut_component_guid }}') {
            throw 'Different Pioneer versions share a desktop shortcut component identity'
          }

      - name: Compile Windows installer authoring
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $themePath = Join-Path $env:GITHUB_WORKSPACE 'src\build\windows\BundleTheme.xml'
          [xml]$theme = Get-Content -Raw $themePath
          $ns = [System.Xml.XmlNamespaceManager]::new($theme.NameTable)
          $ns.AddNamespace('theme', 'http://wixtoolset.org/schemas/thmutil/2010')

          $window = $theme.SelectSingleNode('/theme:Theme/theme:Window', $ns)
          $installButton = $theme.SelectSingleNode(
            '/theme:Theme/theme:Page[@Name="Install"]/theme:Button[@Name="InstallButton"]', $ns)
          $desktopCheckbox = $theme.SelectSingleNode(
            '/theme:Theme/theme:Page[@Name="Install"]/theme:Checkbox[@Name="CreateDesktopShortcut"]', $ns)
          $windowHeight = [int]$window.Height
          $buttonHeight = [int]$installButton.Height
          $buttonTop = $windowHeight + [int]$installButton.Y - $buttonHeight
          $checkboxBottom = [int]$desktopCheckbox.Y + [int]$desktopCheckbox.Height

          if ($windowHeight -gt 390) {
            throw 'Windows setup is too tall for a 900 px display at 200% scaling'
          }
          if ($buttonHeight -ne 30) {
            throw 'Windows setup action buttons must retain the polished 30-unit height'
          }
          if (($buttonTop - $checkboxBottom) -lt 16) {
            throw 'Windows setup choices overlap or crowd the action-button row'
          }

          $testRoot = Join-Path $env:RUNNER_TEMP 'pioneer-wix-authoring'
          $payload = Join-Path $testRoot 'payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Set-Content -Path (Join-Path $payload 'pioneer-gui.exe') -Value 'authoring test payload'
          Copy-Item src\build\windows\LICENSE.rtf (Join-Path $payload 'LICENSE.rtf')

          & heat.exe dir $payload `
            -cg ProductComponents `
            -dr INSTALLFOLDER `
            -platform x64 `
            -gg -scom -sreg -sfrag -srd `
            -var var.SourceDir `
            -out (Join-Path $testRoot 'components.wxs')

          & candle.exe `
            -dSourceDir="$payload" `
            -dProductVersion="2.1.0" `
            -dDisplayVersion="v2.1.0" `
            -dInstallKey="2.1.0" `
            -dProductDescription="Pioneer installer authoring test" `
            -dPackageIdentifier="edu.washu.goldfarblab.pioneer" `
            -dUpgradeCode="${{ steps.first.outputs.msi_upgrade_code }}" `
            -dPermissionsComponentGuid="${{ steps.first.outputs.permissions_component_guid }}" `
            -dShortcutComponentGuid="${{ steps.first.outputs.shortcut_component_guid }}" `
            -dDesktopShortcutComponentGuid="${{ steps.first.outputs.desktop_shortcut_component_guid }}" `
            -dPathComponentGuid="${{ steps.first.outputs.path_component_guid }}" `
            -dIconIco="${{ github.workspace }}\gui\src-tauri\icons\icon.ico" `
            -dPlatform="x64" `
            -arch x64 `
            -ext WixUIExtension `
            -ext WixUtilExtension `
            -out "$testRoot\" `
            src\build\windows\installer.wxs `
            (Join-Path $testRoot 'components.wxs')

          $msi = Join-Path $testRoot 'Pioneer-test.msi'
          & light.exe `
            -ext WixUIExtension `
            -ext WixUtilExtension `
            -cultures:en-us `
            -sval `
            -out $msi `
            (Join-Path $testRoot 'installer.wixobj') `
            (Join-Path $testRoot 'components.wixobj')

          & candle.exe `
            -ext WixBalExtension `
            -ext WixUtilExtension `
            -dBundleVersion="2.1.0.1" `
            -dDisplayVersion="v2.1.0" `
            -dPackageIdentifier="edu.washu.goldfarblab.pioneer" `
            -dBundleUpgradeCode="${{ steps.first.outputs.bundle_upgrade_code }}" `
            -dInstallKey="2.1.0" `
            -dMsiFile="$msi" `
            -dVcRedistFile="$env:WINDIR\System32\where.exe" `
            -dLicenseRtf="${{ github.workspace }}\src\build\windows\LICENSE.rtf" `
            -dIconIco="${{ github.workspace }}\gui\src-tauri\icons\icon.ico" `
            -dLogoPng="${{ github.workspace }}\src\build\windows\PioneerLogo.png" `
            -dThemeFile="${{ github.workspace }}\src\build\windows\BundleTheme.xml" `
            -arch x64 `
            -out "$testRoot\" `
            src\build\windows\Bundle.wxs

          $bundle = Join-Path $testRoot 'PioneerSetup-test.exe'
          & light.exe `
            -ext WixBalExtension `
            -ext WixUtilExtension `
            -out $bundle `
            (Join-Path $testRoot 'Bundle.wixobj')

          if (-not (Test-Path $msi) -or -not (Test-Path $bundle)) {
            throw 'WiX authoring test did not produce both installer artifacts'
          }

  test:
    name: Julia ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        version: ['1.12.6']  # pin exact patch — 1.12.5 had inference segfaults
        os:      [ubuntu-latest]
        arch:    [x64]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch:    ${{ matrix.arch }}

      - name: Cache Julia packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.julia/registries
            ~/.julia/packages
          key: julia-${{ matrix.version }}-${{ runner.os }}-${{ hashFiles('**/Project.toml','**/Manifest.toml') }}
          restore-keys: |
            julia-${{ matrix.version }}-${{ runner.os }}-

      - name: Instantiate & build
        run: |
          julia --threads auto --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build()'

      - name: Run tests
        run: julia --threads auto --code-coverage=all --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  
