name: Build macOS

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Explicit git ref or SHA to build instead of the workflow ref"
        required: false
        type: string
        default: ""
      package_installer:
        description: "Build, notarize, and upload the native .pkg installer"
        required: false
        type: boolean
        default: true
      artifact_retention_days:
        description: "Retention for uploaded installer artifacts"
        required: false
        type: number
        default: 3
      version_override:
        description: "Explicit version to use instead of deriving from the git ref"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Explicit git ref or SHA to build instead of the workflow ref"
        required: false
        type: string
        default: ""
      package_installer:
        description: "Build, notarize, and upload the native .pkg installer"
        required: false
        type: boolean
        default: false
      artifact_retention_days:
        description: "Retention for uploaded installer artifacts"
        required: false
        type: number
        default: 3
      version_override:
        description: "Explicit version to use instead of deriving from the git ref"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: 'Build version'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build & Package macOS
    concurrency:
      group: >-
        ${{ github.event_name == 'workflow_call' &&
            format('call-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.identifier) ||
            format('{0}-{1}-{2}', github.workflow, github.ref_name, matrix.identifier) }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    env:
      JULIA_NUM_THREADS: auto
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            identifier: macos-x64
          - arch: arm64
            runner: macos-latest
            identifier: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Determine VERSION
        id: get_version
        uses: ./.github/actions/determine-version
        with:
          fallback: "dev"
          override: ${{ inputs.version_override }}

      - name: Install Rosetta 2 (arm64)
        if: matrix.arch == 'arm64'
        run: |
          if /usr/sbin/pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
            echo "Rosetta 2 already installed"
          else
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Normalize versions
        id: norm
        uses: ./.github/actions/normalize-versions
        with:
          raw: ${{ steps.get_version.outputs.version }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.6'  # must satisfy Project.toml's julia = "1.12.5" compat
          arch: ${{ matrix.arch }}

      - name: Cache Julia packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.julia/registries
            ~/.julia/packages
          key: julia-macos-${{ matrix.identifier }}-${{ hashFiles('**/Project.toml','**/Manifest.toml') }}
          restore-keys: julia-macos-${{ matrix.identifier }}-

      - name: Install the Apple certificate and provisioning profile
        if: github.event_name != 'pull_request' && env.MACOS_CERT_P12 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          PKG_SIGN_IDENTITY: ${{ secrets.PKG_SIGN_IDENTITY }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          INSTALLER_CERT_PATH=$RUNNER_TEMP/installer_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_NAME=app-signing.keychain-db
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$INSTALLER_CERT_BASE64" | base64 --decode -o $INSTALLER_CERT_PATH

          if [[ -z "${CODESIGN_IDENTITY}" ]]; then
            echo "Error: CODESIGN_IDENTITY is not set or empty."
            exit 1
          fi

          if [[ -z "${PKG_SIGN_IDENTITY}" ]]; then
            echo "Error: PKG_SIGN_IDENTITY is not set or empty."
            exit 1
          fi

          security list-keychains -d user -s login.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T "/usr/bin/codesign" -T "/usr/bin/productsign"
          security import "$INSTALLER_CERT_PATH" -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T "/usr/bin/codesign" -T "/usr/bin/productsign"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" -D "$CODESIGN_IDENTITY" -t private "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" -D "$PKG_SIGN_IDENTITY" -t private "$KEYCHAIN_PATH"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_NAME=$KEYCHAIN_NAME"
          } >> "$GITHUB_ENV"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Install dependencies
        run: |
          julia --threads auto --startup-file=no --project=. \
            -e 'using Pkg; Pkg.instantiate()'
          julia --threads auto --startup-file=no --project=packaging/compiler \
            -e 'using Pkg; Pkg.instantiate()'

      - name: Validate locked application environment
        run: |
          export LIGHTGBM_LOG_LIBRARY_DISCOVERY=false
          julia --threads auto --startup-file=no --project=. \
            packaging/check_app_contract.jl
          julia --threads auto --startup-file=no --project=. \
            src/build/check_cpu_dependencies.jl
          git diff --exit-code -- \
            Manifest.toml packaging/compiler/Manifest.toml

      - name: Precompile data (cache & download)
        uses: ./.github/actions/precompile-data
        with:
          cache-key: precompile-data-v2-yeast

      - name: Compile application
        run: |
          export LIGHTGBM_LOG_LIBRARY_DISCOVERY=false
          export GKSwstype=100
          export GKS_WSTYPE=100
          unset PIONEER_APP_CPU_TARGET
          export JULIA_DEPOT_PATH="$RUNNER_TEMP/julia-depot:$HOME/.julia"
          mkdir -p "$RUNNER_TEMP/julia-depot"
          julia --threads auto --startup-file=no --project=packaging/compiler \
            packaging/build_app.jl \
            "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/"

      - name: Download PioneerConverter
        shell: bash
        run: |
          mkdir -p converter
          if [[ "${{ matrix.identifier }}" == "macos-x64" ]]; then
            PATTERN="osx-x64"
          else
            PATTERN="osx-arm64"
          fi
          ASSET=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/nwamsley1/PioneerConverter/releases/latest \
            | jq -r --arg PATTERN "$PATTERN" '.assets[]
              | select(.name | test("PioneerConverter-"+$PATTERN+".*\\.zip"))
              | .name' | head -n1)

          if [[ -z "$ASSET" ]]; then
            echo "Error: ASSET not found"
            exit 1
          fi

          curl -L "https://github.com/nwamsley1/PioneerConverter/releases/latest/download/$ASSET" \
            -o converter.zip
          unzip -q converter.zip -d converter
          cp -r "converter/PioneerConverter-${PATTERN}/bin/"* \
            "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/bin/"
          mkdir -p "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/lib"
          cp -r "converter/PioneerConverter-${PATTERN}/lib/"* \
            "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/lib/"

      - name: Add wrapper scripts
        run: |
          cp src/build/CLI/pioneer \
            build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/
          chmod +x build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/pioneer

      # Convenience only -- NOT on the release path. The shipped .pkg gets its
      # data/ from the codesign step below, which the release always reaches
      # (release.yml passes package_installer: true), and the .pkg is the only
      # artifact this workflow uploads. But asset_path() falls back to
      # <exe_dir>/../data, so a locally built app tree without data/ fails every
      # search that relies on default params -- a footgun that has already cost
      # two manual workarounds. Additive and guarded, so it cannot affect the
      # package.
      - name: Copy assets into the app tree
        shell: bash
        run: |
          DIST="build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer"
          mkdir -p "$DIST/data"
          cp -R assets/* "$DIST/data/" || true

      - name: Write bundled version
        shell: bash
        run: |
          echo "${{ steps.get_version.outputs.version }}" > \
            build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/VERSION

      # ---- GUI (gui/) -------------------------------------------------
      # The desktop front end is a Tauri app built from source in this repo. It
      # deliberately does NOT bundle a copy of the distribution. Its build-time
      # install key points it at the matching /usr/local/lib/pioneer/<version>
      # payload, even when several versions are installed.
      - name: Setup Node (GUI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust (GUI)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (GUI)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Build GUI
        working-directory: gui
        env:
          # Letting the Tauri bundler sign is more reliable than signing the
          # .app afterwards: it signs nested binaries inside-out, which a flat
          # find-and-sign loop over files cannot do correctly.
          APPLE_SIGNING_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          PIONEER_INSTALL_KEY: ${{ steps.norm.outputs.install_key }}
        run: |
          npm ci
          RAW_VERSION='${{ steps.get_version.outputs.version }}'
          PACKAGE_SUFFIX='${{ steps.norm.outputs.package_suffix }}'
          jq -n \
            --arg productName "Pioneer $RAW_VERSION" \
            --arg version '${{ steps.norm.outputs.pkg }}' \
            --arg identifier "org.pioneer.console.v$PACKAGE_SUFFIX" \
            '{productName: $productName, version: $version, identifier: $identifier}' \
            > tauri.installer.conf.json
          # --bundles app: only the .app is wanted, since it is staged into the
          # .pkg below. The default target set also builds a DMG, whose
          # bundle_dmg.sh drives Finder via AppleScript and fails on a headless
          # runner — which would fail the whole release build for an artifact
          # we then throw away.
          npm run tauri:build -- --bundles app --config tauri.installer.conf.json

      - name: Codesign & package macOS app
        if: env.MACOS_CERT_P12 != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.package_installer)
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          PKG_SIGN_IDENTITY: ${{ secrets.PKG_SIGN_IDENTITY }}
        run: |
          set -euo pipefail

          # Helper function: retry codesign with exponential backoff
          codesign_with_retry() {
            local target="$1"
            local max_attempts=5
            local attempt=1
            local wait_time=2

            while [ "$attempt" -le "$max_attempts" ]; do
              if codesign --deep --force --options runtime \
                --timestamp \
                --entitlements src/build/osx/entitlements.plist \
                --sign "$CODESIGN_IDENTITY" "$target" 2>&1; then
                return 0
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Codesign attempt $attempt failed for $target, retrying in ${wait_time}s..."
                sleep "$wait_time"
                wait_time=$((wait_time * 2))
                attempt=$((attempt + 1))
              else
                echo "Codesign failed after $max_attempts attempts for $target"
                return 1
              fi
            done
          }

          DIST="build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer"
          PKGROOT="pkgroot"
          PKG_SCRIPTS="pkg-scripts"
          VERSION='${{ steps.norm.outputs.pkg }}.${{ github.run_number }}'
          RAW_VERSION='${{ steps.get_version.outputs.version }}'
          INSTALL_KEY='${{ steps.norm.outputs.install_key }}'
          PACKAGE_SUFFIX='${{ steps.norm.outputs.package_suffix }}'
          INSTALL_ROOT="/usr/local/lib/pioneer/$INSTALL_KEY"
          GUI_NAME="Pioneer $RAW_VERSION.app"

          echo "Starting codesigning at $(date)"

          rm -rf "$PKGROOT"
          rm -rf "$PKG_SCRIPTS"
          mkdir -p "$PKGROOT$INSTALL_ROOT"
          cp -R "$DIST"/* "$PKGROOT$INSTALL_ROOT/"
          mkdir -p "$PKGROOT$INSTALL_ROOT/data"
          cp -R assets/* "$PKGROOT$INSTALL_ROOT/data/" || true
          mkdir -p "$PKGROOT$INSTALL_ROOT/libexec"
          cp src/build/osx/uninstall "$PKGROOT$INSTALL_ROOT/libexec/uninstall"
          chmod 0755 "$PKGROOT$INSTALL_ROOT/libexec/uninstall"

          # The versioned GUI is signed by Tauri and is deliberately not walked
          # by the per-file signing loop below.
          GUI_APP="gui/src-tauri/target/release/bundle/macos/$GUI_NAME"
          if [[ -d "$GUI_APP" ]]; then
            mkdir -p "$PKGROOT/Applications"
            cp -R "$GUI_APP" "$PKGROOT/Applications/$GUI_NAME"
          else
            echo "GUI bundle not found at $GUI_APP — packaging CLI only"
          fi
          chmod -R a+w "$PKGROOT$INSTALL_ROOT/share/julia" || true

          # Sign every file with retry
          while IFS= read -r -d '' f; do
            codesign_with_retry "$f" || exit 1
          done < <(find "$PKGROOT$INSTALL_ROOT" -type f -print0)

          mkdir -p "$PKGROOT/usr/local/bin"
          ln -s "$INSTALL_ROOT/pioneer" "$PKGROOT/usr/local/bin/pioneer-$INSTALL_KEY"
          if [[ -d "$GUI_APP" ]]; then
            ln -s "/Applications/$GUI_NAME/Contents/MacOS/pioneer-console" \
              "$PKGROOT/usr/local/bin/pioneer-gui-$INSTALL_KEY"
          fi

          BASE_IDENTIFIER=$(jq -r '.identifier' src/build/package_info.json)
          IDENTIFIER="${BASE_IDENTIFIER}.v${PACKAGE_SUFFIX}"
          echo "Using package identifier: $IDENTIFIER"

          # macOS has no package-uninstall transaction. The preinstall script
          # makes a same-version install a true replacement; postinstall moves
          # only the shared command selectors to the newly installed version.
          mkdir -p "$PKG_SCRIPTS"
          cat <<EOF > "$PKG_SCRIPTS/preinstall"
          #!/bin/sh
          set -e
          rm -rf "$INSTALL_ROOT"
          rm -rf "/Applications/$GUI_NAME"
          EOF
          cat <<EOF > "$PKG_SCRIPTS/postinstall"
          #!/bin/sh
          set -e
          mkdir -p /usr/local/lib/pioneer /usr/local/bin
          touch "$INSTALL_ROOT/.installed-at"
          ln -sfn "$INSTALL_ROOT" /usr/local/lib/pioneer/current
          ln -sfn /usr/local/lib/pioneer/current/pioneer /usr/local/bin/pioneer
          if [ -e "/Applications/$GUI_NAME/Contents/MacOS/pioneer-console" ]; then
            ln -sfn "/Applications/$GUI_NAME/Contents/MacOS/pioneer-console" /usr/local/bin/pioneer-gui
          fi
          EOF
          chmod 0755 "$PKG_SCRIPTS/preinstall" "$PKG_SCRIPTS/postinstall"

          pkgbuild --root "$PKGROOT" \
                  --identifier "$IDENTIFIER" \
                  --version "$VERSION" \
                  --scripts "$PKG_SCRIPTS" \
                  --install-location / PioneerUnsigned.pkg

          productsign --sign "$PKG_SIGN_IDENTITY" \
                      PioneerUnsigned.pkg \
                      Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.pkg

          rm PioneerUnsigned.pkg


      - name: Notarize macOS package
        if: env.MACOS_CERT_P12 != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.package_installer)
        timeout-minutes: 240
        env:
          AC_USERNAME: ${{ secrets.NOTARIZE_APPLE_ID }}
          AC_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          TEAM_ID:    ${{ secrets.NOTARIZE_TEAM_ID }}
        run: |
          echo "Starting notarization at $(date)"
          xcrun notarytool store-credentials notary-profile \
            --apple-id "$AC_USERNAME" --team-id "$TEAM_ID" \
            --password "$AC_PASSWORD"

          echo "Submitting package for notarization at $(date)"
          result=$(xcrun notarytool submit \
                     Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.pkg \
                     --keychain-profile notary-profile \
                     --wait --output-format json 2>&1) || {
            echo "Notarization command failed or timed out at $(date)"
            echo "Result: $result"
            exit 1
          }

          echo "Notarization completed at $(date)"
          status=$(echo "$result" | jq -r .status)
          subid=$(echo "$result" | jq -r .id)
          echo "Notarization status: $status"
          echo "Submission ID: $subid"

          if [[ "$status" != "Accepted" ]]; then
            echo "Notarization failed: $status"
            xcrun notarytool log "$subid" --keychain-profile notary-profile
            exit 1
          fi
          echo "Notarization successful at $(date)"

      - name: Staple notarization ticket
        if: env.MACOS_CERT_P12 != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.package_installer)
        run: |
          xcrun stapler staple \
            Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.pkg

      - name: Validate signed pkg
        if: env.MACOS_CERT_P12 != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.package_installer)
        run: |
          PKG="Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.pkg"
          echo "Validating pkg with spctl: $PKG"
          spctl -a -vv -t install "$PKG"

      - name: Clean up temporary signing keychain
        if: always() && env.MACOS_CERT_P12 != ''
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          security default-keychain -d user -s login.keychain
          security list-keychains -d user -s login.keychain

      - name: Upload signed package
        if: env.MACOS_CERT_P12 != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.package_installer)
        uses: actions/upload-artifact@v7
        with:
          name: Pioneer-${{ matrix.identifier }}-pkg
          path: Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.pkg
          retention-days: ${{ inputs.artifact_retention_days }}
