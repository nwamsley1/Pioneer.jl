name: Diag Windows Runner

# Temporary diagnostic. Three Build Windows attempts died in Compile
# application after ~2.5 h, and the last two lost the runner with no logs at
# all, so nothing about the machine's actual limits is known. This probes the
# runner in about a minute and returns logs, instead of learning nothing from
# another 2.5 h build. Delete once Windows is green.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe windows-latest limits
    runs-on: windows-latest
    steps:
      - name: Memory, pagefile and disk
        shell: pwsh
        run: |
          Write-Host "=== physical memory ==="
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{n='TotalRAM_GB';e={[math]::Round($_.TotalPhysicalMemory/1GB,2)}},
                          AutomaticManagedPagefile | Format-List

          Write-Host "=== pagefile (setting) ==="
          Get-CimInstance Win32_PageFileSetting |
            Select-Object Name, InitialSize, MaximumSize | Format-List

          Write-Host "=== pagefile (in use) ==="
          Get-CimInstance Win32_PageFileUsage |
            Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage | Format-List

          Write-Host "=== virtual memory totals ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object @{n='TotalVisibleMemory_GB';e={[math]::Round($_.TotalVisibleMemorySize/1MB,2)}},
                          @{n='FreePhysical_GB';e={[math]::Round($_.FreePhysicalMemory/1MB,2)}},
                          @{n='TotalVirtual_GB';e={[math]::Round($_.TotalVirtualMemorySize/1MB,2)}},
                          @{n='FreeVirtual_GB';e={[math]::Round($_.FreeVirtualMemory/1MB,2)}} | Format-List

          Write-Host "=== volumes (which drive has room for a pagefile or big temp?) ==="
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID,
                          @{n='Size_GB';e={[math]::Round($_.Size/1GB,1)}},
                          @{n='Free_GB';e={[math]::Round($_.FreeSpace/1GB,1)}} | Format-Table

          Write-Host "=== where the build would put things ==="
          Write-Host "  TEMP        = $env:TEMP"
          Write-Host "  RUNNER_TEMP = $env:RUNNER_TEMP"
          Write-Host "  workspace   = $env:GITHUB_WORKSPACE"

      - name: Can the pagefile actually be changed without a reboot?
        shell: pwsh
        continue-on-error: true
        run: |
          # The earlier attempt deleted the existing pagefile before creating a
          # new one. If creation fails, that leaves the machine with LESS
          # virtual memory than it started with. Test additively instead:
          # create a second pagefile and see whether it is honoured live.
          $target = if (Test-Path 'D:\') { 'D:\pagefile.sys' } else { 'C:\pagefile.sys' }
          Write-Host "target: $target"

          $cs = Get-CimInstance Win32_ComputerSystem
          if ($cs.AutomaticManagedPagefile) {
            Set-CimInstance -InputObject $cs -Property @{AutomaticManagedPagefile = $false}
            Write-Host "disabled automatic management"
          }

          $existing = Get-CimInstance Win32_PageFileSetting -Filter "Name='$($target -replace '\\','\\\\')'" -ErrorAction SilentlyContinue
          if ($existing) {
            Set-CimInstance -InputObject $existing -Property @{InitialSize = 8192; MaximumSize = 16384}
            Write-Host "resized existing"
          } else {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name = $target} | Out-Null
            $new = Get-CimInstance Win32_PageFileSetting -Filter "Name='$($target -replace '\\','\\\\')'"
            Set-CimInstance -InputObject $new -Property @{InitialSize = 8192; MaximumSize = 16384}
            Write-Host "created new"
          }

          Write-Host "=== setting after change ==="
          Get-CimInstance Win32_PageFileSetting | Select-Object Name, InitialSize, MaximumSize | Format-List
          Write-Host "=== in use after change (does it apply without reboot?) ==="
          Get-CimInstance Win32_PageFileUsage | Select-Object Name, AllocatedBaseSize | Format-List
          Get-CimInstance Win32_OperatingSystem |
            Select-Object @{n='TotalVirtual_GB';e={[math]::Round($_.TotalVirtualMemorySize/1MB,2)}} | Format-List
