name: Build Windows

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Explicit git ref or SHA to build instead of the workflow ref"
        required: false
        type: string
        default: ""
      package_installer:
        description: "Build and upload the native MSI installer"
        required: false
        type: boolean
        default: true
      artifact_retention_days:
        description: "Retention for uploaded installer artifacts"
        required: false
        type: number
        default: 3
      version_override:
        description: "Explicit version to use instead of deriving from the git ref"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Explicit git ref or SHA to build instead of the workflow ref"
        required: false
        type: string
        default: ""
      package_installer:
        description: "Build and upload the native MSI installer"
        required: false
        type: boolean
        default: false
      artifact_retention_days:
        description: "Retention for uploaded installer artifacts"
        required: false
        type: number
        default: 3
      version_override:
        description: "Explicit version to use instead of deriving from the git ref"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: 'Build version'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build & Package Windows
    concurrency:
      group: >-
        ${{ github.event_name == 'workflow_call' &&
            format('call-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.identifier) ||
            format('{0}-{1}-{2}', github.workflow, github.ref_name, matrix.identifier) }}
      cancel-in-progress: true
    runs-on: windows-latest
    env:
      JULIA_NUM_THREADS: auto
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            identifier: windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Determine VERSION
        id: get_version
        uses: ./.github/actions/determine-version
        with:
          fallback: "dev"
          override: ${{ inputs.version_override }}

      - name: Normalize versions
        id: norm
        uses: ./.github/actions/normalize-versions
        with:
          raw: ${{ steps.get_version.outputs.version }}

      # The --output-o codegen peaked with only 151 MiB free on this 15.99 GB
      # runner and was killed. macOS x64 completes the identical create_app on
      # a runner with *less* RAM, because macOS compresses memory and grows
      # swap on demand; the Windows images ship a small, fixed pagefile. So the
      # shortfall is virtual-memory headroom rather than three cpu targets
      # being inherently too expensive.
      #
      # This step is self-verifying on purpose: it prints the resulting
      # pagefile and free disk. Pagefile changes can require a reboot to take
      # effect, so if the "after" block does not show the new size we will know
      # from the log immediately, rather than after another 2.5 hour build.
      - name: Enlarge the pagefile
        shell: pwsh
        run: |
          Write-Host "=== before ==="
          Get-CimInstance Win32_PageFileUsage | Select-Object Name, AllocatedBaseSize | Format-List
          Get-PSDrive C, D -ErrorAction SilentlyContinue |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table

          $cs = Get-CimInstance Win32_ComputerSystem
          if ($cs.AutomaticManagedPagefile) {
            Set-CimInstance -InputObject $cs -Property @{AutomaticManagedPagefile = $false}
          }
          # D: is the large volume on these images; C: is comparatively small.
          $existing = Get-CimInstance Win32_PageFileSetting -ErrorAction SilentlyContinue
          foreach ($p in $existing) { Remove-CimInstance -InputObject $p -ErrorAction SilentlyContinue }
          New-CimInstance -ClassName Win32_PageFileSetting `
            -Property @{Name = 'D:\pagefile.sys'; InitialSize = 24576; MaximumSize = 49152} `
            -ErrorAction SilentlyContinue | Out-Null

          Write-Host "=== after ==="
          Get-CimInstance Win32_PageFileSetting |
            Select-Object Name, InitialSize, MaximumSize | Format-List
          Get-CimInstance Win32_PageFileUsage | Select-Object Name, AllocatedBaseSize | Format-List

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.6'  # must satisfy Project.toml's julia = "1.12.5" compat
          arch: ${{ matrix.arch }}

      - name: Cache Julia packages
        uses: actions/cache@v5
        with:
          path: |
            C:\Users\runneradmin\.julia\registries
            C:\Users\runneradmin\.julia\packages
          key: julia-windows-${{ matrix.identifier }}-${{ hashFiles('**/Project.toml','**/Manifest.toml') }}
          restore-keys: julia-windows-${{ matrix.identifier }}-

      - name: Install dependencies
        shell: bash
        run: |
          julia --threads auto --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --threads auto --project=dev -e 'using Pkg; Pkg.instantiate()'

      - name: Precompile data (cache & download)
        uses: ./.github/actions/precompile-data
        with:
          cache-key: precompile-data-v2-yeast

      # Before create_app, because a dead statements file is cheap to detect and expensive to ship.
      # PackageCompiler skips unresolvable statements silently, so drift would otherwise be invisible.
      - name: Check precompile statements
        shell: bash
        run: |
          export LIGHTGBM_LOG_LIBRARY_DISCOVERY=false
          julia --threads auto --project=. src/build/check_statements.jl

      - name: Compile application
        shell: bash
        run: |
          export LIGHTGBM_LOG_LIBRARY_DISCOVERY=false
          fresh_depot="$(mktemp -d)"
          export JULIA_DEPOT_PATH="$(cygpath -w "$fresh_depot");$(cygpath -w "$HOME/.julia")"
          julia --threads auto --project=dev -e '
            using PackageCompiler;
            create_app(
              ".",
              "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/",
              incremental=false,
              force=true,
              executables=[
                "GetSearchParams"=>"main_GetSearchParams",
                "GetBuildLibParams"=>"main_GetBuildLibParams",
                "GetParseSpecLibParams"=>"main_GetParseSpecLibParams",
                "BuildSpecLib"=>"main_BuildSpecLib",
                "SearchDIA"=>"main_SearchDIA",
                "convertMzML"=>"main_convertMzML"
              ],
              precompile_execution_file="src/build/snoop.jl",
              precompile_statements_file="src/build/precompile_statements.jl"
            );
          '

      - name: Download PioneerConverter
        shell: pwsh
        run: |
          $dir = "converter"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pattern = "win-x64"
          $headers = @{ Accept = 'application/vnd.github+json'; Authorization = 'Bearer ${{ github.token }}' }
          $json = Invoke-WebRequest -Uri https://api.github.com/repos/nwamsley1/PioneerConverter/releases/latest -Headers $headers |
                  Select-Object -ExpandProperty Content | ConvertFrom-Json
          $asset = ($json.assets | Where-Object { $_.name -like "*$pattern*.zip" } | Select-Object -First 1).name
          if (-not $asset) {
            Write-Error "Error: ASSET not found"
            exit 1
          }
          Invoke-WebRequest -Uri "https://github.com/nwamsley1/PioneerConverter/releases/latest/download/$asset" -OutFile converter.zip
          Expand-Archive -Path converter.zip -DestinationPath $dir
          $subdir = Get-ChildItem -Path $dir -Directory | Select-Object -First 1
          Copy-Item "$($subdir.FullName)\bin\*" "build\Pioneer_${{ matrix.identifier }}\Applications\Pioneer\bin\" -Recurse
          New-Item -ItemType Directory -Force -Path "build\Pioneer_${{ matrix.identifier }}\Applications\Pioneer\lib" | Out-Null
          Copy-Item "$($subdir.FullName)\lib\*" "build\Pioneer_${{ matrix.identifier }}\Applications\Pioneer\lib\" -Recurse

      - name: Add wrapper scripts
        shell: pwsh
        run: |
          Copy-Item src\build\CLI\pioneer.bat build\Pioneer_${{ matrix.identifier }}/Applications/Pioneer/

      - name: Write bundled version
        shell: pwsh
        run: |
          Set-Content -Path "build\Pioneer_${{ matrix.identifier }}\Applications\Pioneer\VERSION" `
                      -Value "${{ steps.get_version.outputs.version }}"

      - name: Pre-download artifacts
        shell: pwsh
        run: |
          $pioneerRoot = "build\Pioneer_${{ matrix.identifier }}\Applications\Pioneer"
          $dummy = "$pioneerRoot\dummy"
          New-Item -ItemType Directory -Force -Path $dummy | Out-Null
          & "$pioneerRoot\pioneer.bat" params-predict $dummy $dummy --params-path "$dummy\params.json"
          Remove-Item -Recurse -Force $dummy

      - name: Normalize version for MSI
        id: semver
        shell: pwsh
        run: |
          $raw = '${{ steps.get_version.outputs.version }}'

          # strip leading 'v' / 'V'
          $clean = $raw -replace '^[vV]', ''

          # drop prerelease/build metadata (e.g. -rc.1, +build)
          $clean = $clean.Split('+')[0]
          $clean = $clean.Split('-')[0]

          # pad/trim to 3–4 numeric fields for MSI (x.y.z[.w])
          $parts = $clean.Split('.')
          if ($parts.Count -lt 3) {
            $clean = ($parts + @('0','0'))[0..2] -join '.'
          } elseif ($parts.Count -gt 4) {
            $clean = $parts[0..3] -join '.'
          }

          "msi_version=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "MSI_VERSION=$clean"

      # ---- GUI (gui/) -------------------------------------------------
      # windows-latest ships MSVC and the WebView2 runtime, so this needs no
      # extra system packages. The exe is copied into $pioneerRoot below, where
      # heat.exe harvests it automatically.
      - name: Setup Node (GUI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust (GUI)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (GUI)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Build GUI
        working-directory: gui
        shell: pwsh
        run: |
          npm ci
          # --no-bundle: the bare exe is wanted, not Tauri's own MSI.
          npm run tauri:build -- --no-bundle

      - name: Package Windows MSI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package_installer
        shell: pwsh
        run: |
          $pioneerRoot = "build\Pioneer_${{ matrix.identifier }}\Applications\Pioneer"
          $dataDir = "$pioneerRoot\data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Copy-Item assets\* $dataDir -Recurse
          Copy-Item "src\build\windows\LICENSE.rtf" "$pioneerRoot\LICENSE.rtf"

          # Placed in the install root (not bin\) so the MSI's PATH entry,
          # which points at INSTALLFOLDER, also covers the GUI. The Start Menu
          # shortcut in installer.wxs refers to this same location.
          $guiExe = "gui\src-tauri\target\release\pioneer-console.exe"
          if (Test-Path $guiExe) {
            Copy-Item $guiExe "$pioneerRoot\pioneer-gui.exe"
            Write-Host "GUI included in MSI"
          } else {
            Write-Host "GUI exe not found at $guiExe - packaging CLI only"
          }
          $artifactDir = "$pioneerRoot\share\julia\artifacts"
          if (Test-Path $artifactDir) {
            Get-ChildItem -Path $artifactDir -Recurse -Directory |
              Where-Object {
                $_.FullName -like "*QtQuick*" -or
                $_.FullName -like "*Qt6*"     -or
                $_.Name -eq "include"         -or
                $_.Name -eq "test"            -or
                $_.Name -eq ".qt"             -or
                $_.FullName.Length -gt 200
              } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          $info = Get-Content src\build\package_info.json | ConvertFrom-Json
          $desc       = $info.description
          $identifier = $info.identifier
          $rawVersion = '${{ steps.get_version.outputs.version }}'
          Write-Host "MSI will replace any existing Pioneer install (version=$rawVersion)"

          & heat.exe dir $pioneerRoot `
            -cg ProductComponents `
            -dr INSTALLFOLDER `
            -platform x64 `
            -gg -scom -sreg -sfrag -srd `
            -var var.SourceDir `
            -out components.wxs

          & candle.exe `
            -dSourceDir="$pioneerRoot" `
            -dProductVersion="${{ steps.norm.outputs.msi }}" `
            -dProductDescription="$desc" `
            -dPackageIdentifier="$identifier" `
            -dPlatform="x64" `
            -arch x64 `
            -ext WixUIExtension `
            -ext WixUtilExtension `
            src\build\windows\installer.wxs components.wxs

          & light.exe `
            -ext WixUIExtension `
            -ext WixUtilExtension `
            -cultures:en-us `
            -out "Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.msi" `
            installer.wixobj components.wixobj

      - name: Upload MSI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package_installer
        uses: actions/upload-artifact@v7
        with:
          name: Pioneer-${{ matrix.identifier }}-msi
          path: Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.msi
          retention-days: ${{ inputs.artifact_retention_days }}
