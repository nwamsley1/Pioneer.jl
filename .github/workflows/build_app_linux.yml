name: Build Linux

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Explicit git ref or SHA to build instead of the workflow ref"
        required: false
        type: string
        default: ""
      package_installer:
        description: "Build and upload the native .deb installer"
        required: false
        type: boolean
        default: true
      artifact_retention_days:
        description: "Retention for uploaded installer artifacts"
        required: false
        type: number
        default: 3
      version_override:
        description: "Explicit version to use instead of deriving from the git ref"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Explicit git ref or SHA to build instead of the workflow ref"
        required: false
        type: string
        default: ""
      package_installer:
        description: "Build and upload the native .deb installer"
        required: false
        type: boolean
        default: false
      artifact_retention_days:
        description: "Retention for uploaded installer artifacts"
        required: false
        type: number
        default: 3
      version_override:
        description: "Explicit version to use instead of deriving from the git ref"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: 'Build version'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build & Package Linux
    concurrency:
      group: >-
        ${{ github.event_name == 'workflow_call' &&
            format('call-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.identifier) ||
            format('{0}-{1}-{2}', github.workflow, github.ref_name, matrix.identifier) }}
      cancel-in-progress: true
    runs-on: [self-hosted, Linux, pioneer-compile]
    env:
      JULIA_NUM_THREADS: auto
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            identifier: linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Determine VERSION
        id: get_version
        uses: ./.github/actions/determine-version
        with:
          fallback: "dev"
          override: ${{ inputs.version_override }}

      - name: Normalize versions
        id: norm
        uses: ./.github/actions/normalize-versions
        with:
          raw: ${{ steps.get_version.outputs.version }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.6'  # must satisfy Project.toml's julia = "1.12.5" compat

      - name: Cache Julia packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.julia/registries
            ~/.julia/packages
          key: julia-linux-${{ matrix.identifier }}-${{ hashFiles('**/Project.toml','**/Manifest.toml') }}
          restore-keys: julia-linux-${{ matrix.identifier }}-

      - name: Install dependencies
        run: |
          julia --threads auto --startup-file=no --project=. \
            -e 'using Pkg; Pkg.instantiate()'
          julia --threads auto --startup-file=no --project=packaging/compiler \
            -e 'using Pkg; Pkg.instantiate()'

      - name: Validate locked application environment
        run: |
          export LIGHTGBM_LOG_LIBRARY_DISCOVERY=false
          julia --threads auto --startup-file=no --project=. \
            packaging/check_app_contract.jl
          julia --threads auto --startup-file=no --project=. \
            src/build/check_cpu_dependencies.jl
          git diff --exit-code -- \
            Manifest.toml packaging/compiler/Manifest.toml

      - name: Precompile data (cache & download)
        uses: ./.github/actions/precompile-data
        with:
          cache-key: precompile-data-v2-yeast

      - name: Compile application
        run: |
          export LIGHTGBM_LOG_LIBRARY_DISCOVERY=false
          unset PIONEER_APP_CPU_TARGET
          export JULIA_DEPOT_PATH="$RUNNER_TEMP/julia-depot:$HOME/.julia"
          mkdir -p "$RUNNER_TEMP/julia-depot"
          julia --threads auto --startup-file=no --project=packaging/compiler \
            packaging/build_app.jl \
            "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/"

      - name: Download PioneerConverter
        shell: bash
        run: |
          mkdir -p converter
          PATTERN="${{ matrix.identifier }}"
          ASSET=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/nwamsley1/PioneerConverter/releases/latest \
            | jq -r --arg PATTERN "$PATTERN" '.assets[]
              | select(.name|test("PioneerConverter-"+$PATTERN+".*\\.zip"))
              | .name' | head -n1)

          if [[ -z "$ASSET" ]]; then
            echo "Error: ASSET not found"
            exit 1
          fi

          curl -L "https://github.com/nwamsley1/PioneerConverter/releases/latest/download/$ASSET" \
            -o converter.zip
          unzip -q converter.zip -d converter
          cp -r "converter/PioneerConverter-${PATTERN}/bin/"* \
            "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/bin/"
          mkdir -p "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/lib"
          cp -r "converter/PioneerConverter-${PATTERN}/lib/"* \
            "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/lib/"

      - name: Add wrapper scripts
        shell: bash
        run: |
          cp src/build/CLI/pioneer \
            build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/
          chmod +x build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/pioneer

      - name: Write bundled version
        shell: bash
        run: |
          echo "${{ steps.get_version.outputs.version }}" > \
            build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/VERSION

      - name: Pre-download artifacts
        shell: bash
        run: |
          pioneer_root="build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer"
          dummy="$pioneer_root/dummy"
          mkdir -p "$dummy"
          "$pioneer_root/pioneer" params-predict "$dummy" "$dummy" --params-path "$dummy/params.json"
          rm -rf "$dummy"
          
      # ---- GUI (gui/) -------------------------------------------------
      # The self-hosted runner is provisioned with the native Tauri toolchain.
      # Verify those host dependencies without attempting privileged package
      # installation from a non-interactive Actions job.
      - name: Setup Node (GUI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust (GUI)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify GUI build dependencies
        run: |
          required_packages=(
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            librsvg2-dev
            patchelf
            libayatana-appindicator3-dev
          )
          missing_packages=()
          for package in "${required_packages[@]}"; do
            status="$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)"
            if [[ "$status" != "install ok installed" ]]; then
              missing_packages+=("$package")
            fi
          done
          if (( ${#missing_packages[@]} > 0 )); then
            echo "Missing GUI prerequisites on the self-hosted runner:"
            printf '  %s\n' "${missing_packages[@]}"
            exit 1
          fi

      - name: Build GUI
        working-directory: gui
        env:
          PIONEER_INSTALL_KEY: ${{ steps.norm.outputs.install_key }}
        run: |
          npm ci
          PACKAGE_SUFFIX='${{ steps.norm.outputs.package_suffix }}'
          APP_ID="org.pioneer.console.v$PACKAGE_SUFFIX"
          jq -n --arg identifier "$APP_ID" '{identifier: $identifier}' \
            > tauri.installer.conf.json
          # --no-bundle: we want the bare binary, not Tauri's own .deb. It is
          # installed into Pioneer's package below. The versioned GTK app ID
          # must match the desktop filename and icon name so Linux shells can
          # associate the running window with its Pioneer icon.
          npm run tauri:build -- --no-bundle --config tauri.installer.conf.json

      - name: Package Linux .deb
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package_installer
        run: |
          set -euo pipefail
          RAW_VERSION='${{ steps.get_version.outputs.version }}'
          INSTALL_KEY='${{ steps.norm.outputs.install_key }}'
          PACKAGE_SUFFIX='${{ steps.norm.outputs.package_suffix }}'
          INSTALL_ROOT="/opt/pioneer/$INSTALL_KEY"
          PACKAGE_ROOT="deb$INSTALL_ROOT"

          mkdir -p "$PACKAGE_ROOT"
          cp -r build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/* "$PACKAGE_ROOT/"
          mkdir -p "$PACKAGE_ROOT/data"
          cp -r assets/* "$PACKAGE_ROOT/data/"
          chmod -R a+rwx "$PACKAGE_ROOT/share/julia"

          GUI_BIN="gui/src-tauri/target/release/pioneer-console"
          if [[ ! -f "$GUI_BIN" ]]; then
            echo "GUI build succeeded without producing $GUI_BIN"
            exit 1
          fi
          install -Dm755 "$GUI_BIN" "$PACKAGE_ROOT/bin/pioneer-gui"

          # Every package owns only version-qualified paths. update-alternatives
          # creates the unqualified pioneer/pioneer-gui commands in postinst.
          mkdir -p deb/usr/bin
          ln -s "$INSTALL_ROOT/pioneer" "deb/usr/bin/pioneer-$INSTALL_KEY"
          ln -s "$INSTALL_ROOT/bin/pioneer-gui" "deb/usr/bin/pioneer-gui-$INSTALL_KEY"

          APP_ID="org.pioneer.console.v$PACKAGE_SUFFIX"
          if [[ "$(jq -r '.identifier' gui/tauri.installer.conf.json)" != "$APP_ID" ]]; then
            echo "GUI application ID does not match the packaged desktop entry: $APP_ID"
            exit 1
          fi
          install -Dm644 gui/src-tauri/icons/icon.svg \
            "deb/usr/share/icons/hicolor/scalable/apps/$APP_ID.svg"
          install -Dm644 gui/src-tauri/icons/128x128@2x.png \
            "deb/usr/share/icons/hicolor/256x256/apps/$APP_ID.png"
          mkdir -p deb/usr/share/applications
          cat <<DESKTOP > "deb/usr/share/applications/$APP_ID.desktop"
          [Desktop Entry]
          Type=Application
          Name=Pioneer $RAW_VERSION
          Comment=Search and quantify DIA proteomics data
          Exec=$INSTALL_ROOT/bin/pioneer-gui
          Icon=$APP_ID
          Terminal=false
          Categories=Science;Biology;
          DESKTOP
          GUI_DEPENDS="libwebkit2gtk-4.1-0, libgtk-3-0"
          echo "GUI included in .deb"
          info=src/build/package_info.json
          BASE_PACKAGE=$(jq -r '.package' $info)
          PACKAGE="${BASE_PACKAGE}-${PACKAGE_SUFFIX}"
          MAINTAINER=$(jq -r '.maintainer' $info)
          DESCRIPTION=$(jq -r '.description' $info)
          DEB_VERSION='${{ steps.norm.outputs.deb }}'
          ALT_PRIORITY='${{ steps.norm.outputs.alt_priority }}'

          mkdir -p deb/DEBIAN
          cat <<EOF > deb/DEBIAN/control
          Package: $PACKAGE
          Version: $DEB_VERSION
          Architecture: amd64
          Section: science
          Priority: optional
          Maintainer: $MAINTAINER
          Provides: $BASE_PACKAGE (= $DEB_VERSION)
          Description: $DESCRIPTION
          EOF

          cat <<EOF > deb/DEBIAN/postinst
          #!/bin/sh
          set -e
          update-alternatives --install /usr/bin/pioneer pioneer "$INSTALL_ROOT/pioneer" "$ALT_PRIORITY" \\
            --slave /usr/bin/pioneer-gui pioneer-gui "$INSTALL_ROOT/bin/pioneer-gui"
          EOF

          cat <<EOF > deb/DEBIAN/prerm
          #!/bin/sh
          set -e
          case "\$1" in
            remove|deconfigure)
              update-alternatives --remove pioneer "$INSTALL_ROOT/pioneer"
              ;;
          esac
          EOF
          chmod 0755 deb/DEBIAN/postinst deb/DEBIAN/prerm

          if [[ -n "$GUI_DEPENDS" ]]; then
            sed -i "/^Description:/i Depends: $GUI_DEPENDS" deb/DEBIAN/control
          fi

          dpkg-deb --build --root-owner-group deb \
            Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.deb

      - name: Upload .deb
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package_installer
        uses: actions/upload-artifact@v7
        with:
          name: Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}-deb
          path: Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.deb
          retention-days: ${{ inputs.artifact_retention_days }}
