name: Build Linux

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Explicit git ref or SHA to build instead of the workflow ref"
        required: false
        type: string
        default: ""
      package_installer:
        description: "Build and upload the native .deb installer"
        required: false
        type: boolean
        default: true
      artifact_retention_days:
        description: "Retention for uploaded installer artifacts"
        required: false
        type: number
        default: 3
      version_override:
        description: "Explicit version to use instead of deriving from the git ref"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Explicit git ref or SHA to build instead of the workflow ref"
        required: false
        type: string
        default: ""
      package_installer:
        description: "Build and upload the native .deb installer"
        required: false
        type: boolean
        default: false
      artifact_retention_days:
        description: "Retention for uploaded installer artifacts"
        required: false
        type: number
        default: 3
      version_override:
        description: "Explicit version to use instead of deriving from the git ref"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: 'Build version'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build & Package Linux
    concurrency:
      group: >-
        ${{ github.event_name == 'workflow_call' &&
            format('call-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.identifier) ||
            format('{0}-{1}-{2}', github.workflow, github.ref_name, matrix.identifier) }}
      cancel-in-progress: true
    runs-on: [self-hosted, Linux, pioneer-compile]
    env:
      JULIA_NUM_THREADS: auto
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            identifier: linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Determine VERSION
        id: get_version
        uses: ./.github/actions/determine-version
        with:
          fallback: "dev"
          override: ${{ inputs.version_override }}

      - name: Normalize versions
        id: norm
        uses: ./.github/actions/normalize-versions
        with:
          raw: ${{ steps.get_version.outputs.version }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.6'  # must satisfy Project.toml's julia = "1.12.5" compat

      - name: Cache Julia packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.julia/registries
            ~/.julia/packages
          key: julia-linux-${{ matrix.identifier }}-${{ hashFiles('**/Project.toml','**/Manifest.toml') }}
          restore-keys: julia-linux-${{ matrix.identifier }}-

      - name: Install dependencies
        run: |
          julia --threads auto --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --threads auto --project=dev -e 'using Pkg; Pkg.instantiate()'

      - name: Precompile data (cache & download)
        uses: ./.github/actions/precompile-data
        with:
          cache-key: precompile-data-v2-yeast

      # Before create_app, because a dead statements file is cheap to detect and expensive to ship.
      # PackageCompiler skips unresolvable statements silently, so drift would otherwise be invisible.
      - name: Check precompile statements
        run: |
          export LIGHTGBM_LOG_LIBRARY_DISCOVERY=false
          julia --threads auto --project=. src/build/check_statements.jl

      - name: Compile application
        run: |
          export LIGHTGBM_LOG_LIBRARY_DISCOVERY=false
          export JULIA_DEPOT_PATH="$RUNNER_TEMP/julia-depot:$HOME/.julia"
          mkdir -p "$RUNNER_TEMP/julia-depot"
          # PackageCompiler writes its sysimage and the --output-o object into
          # $TMPDIR, defaulting to /tmp. On most Linux distributions /tmp is a
          # tmpfs -- i.e. RAM, typically capped near 50% of physical memory --
          # and the object is emitted for three CPU targets with clone_all, so
          # it is several times the 2.1 GB finished distribution. Filling tmpfs
          # is a direct route to the OOM killer, which matches the observed
          # kill: the codegen child died with ProcessSignaled(9) and no message
          # in the job log, while the snoop searches before it peaked at only
          # 7.2 GB of 62.5 GB. $RUNNER_TEMP is real disk, like every other
          # platform's temp.
          export TMPDIR="$RUNNER_TEMP/jl-tmp"
          mkdir -p "$TMPDIR"
          julia --threads auto --project=dev -e '
            using PackageCompiler;
            create_app(
              ".",
              "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/",
              incremental=false, force=true,
              executables=[
                "GetSearchParams"=>"main_GetSearchParams",
                "GetBuildLibParams"=>"main_GetBuildLibParams",
                "GetParseSpecLibParams"=>"main_GetParseSpecLibParams",
                "BuildSpecLib"=>"main_BuildSpecLib",
                "SearchDIA"=>"main_SearchDIA",
                "convertMzML"=>"main_convertMzML"
              ],
              precompile_execution_file="src/build/snoop.jl",
              precompile_statements_file="src/build/precompile_statements.jl",
              # Same change as the Windows leg. The x86_64 default is
              #   generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)
              # and clone_all emits a complete duplicate of every function for
              # the sandybridge target, which dominates the --output-o step.
              # This leg died there too, with the codegen child SIGKILLed.
              # base(1) has to go with clone_all, since Julia requires a base
              # target to clone everything. All three tiers remain, so no CPU
              # loses its vector path.
              cpu_target="generic;sandybridge,-xsaveopt;haswell,-rdrnd"
            );
          '

      - name: Download PioneerConverter
        shell: bash
        run: |
          mkdir -p converter
          PATTERN="${{ matrix.identifier }}"
          ASSET=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/nwamsley1/PioneerConverter/releases/latest \
            | jq -r --arg PATTERN "$PATTERN" '.assets[]
              | select(.name|test("PioneerConverter-"+$PATTERN+".*\\.zip"))
              | .name' | head -n1)

          if [[ -z "$ASSET" ]]; then
            echo "Error: ASSET not found"
            exit 1
          fi

          curl -L "https://github.com/nwamsley1/PioneerConverter/releases/latest/download/$ASSET" \
            -o converter.zip
          unzip -q converter.zip -d converter
          cp -r "converter/PioneerConverter-${PATTERN}/bin/"* \
            "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/bin/"
          mkdir -p "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/lib"
          cp -r "converter/PioneerConverter-${PATTERN}/lib/"* \
            "build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/lib/"

      - name: Add wrapper scripts
        shell: bash
        run: |
          cp src/build/CLI/pioneer \
            build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/
          chmod +x build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/pioneer

      - name: Write bundled version
        shell: bash
        run: |
          echo "${{ steps.get_version.outputs.version }}" > \
            build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/VERSION

      - name: Pre-download artifacts
        shell: bash
        run: |
          pioneer_root="build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer"
          dummy="$pioneer_root/dummy"
          mkdir -p "$dummy"
          "$pioneer_root/pioneer" params-predict "$dummy" "$dummy" --params-path "$dummy/params.json"
          rm -rf "$dummy"
          
      # ---- GUI (gui/) -------------------------------------------------
      # This runner is self-hosted, so the webkit/gtk toolchain may or may not
      # be present and apt may not be usable. Both steps are therefore
      # non-fatal: a missing GUI degrades to a CLI-only .deb rather than
      # failing the job, because `publish` needs all three platforms and a
      # Linux failure would block the entire release.
      - name: Setup Node (GUI)
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust (GUI)
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable

      - name: Install GUI build dependencies
        id: gui_deps
        continue-on-error: true
        run: |
          sudo apt-get update
          # Tauri v2 on Linux needs webkit2gtk 4.1 (not 4.0).
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev

      - name: Build GUI
        id: gui_build
        if: steps.gui_deps.outcome == 'success'
        continue-on-error: true
        working-directory: gui
        run: |
          npm ci
          # --no-bundle: we want the bare binary, not Tauri's own .deb. It is
          # installed into Pioneer's package below.
          npm run tauri:build -- --no-bundle

      - name: Package Linux .deb
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package_installer
        run: |
          mkdir -p deb/usr/local/Pioneer
          cp -r build/Pioneer_${{ matrix.identifier }}/Applications/Pioneer/* deb/usr/local/Pioneer/
          mkdir -p deb/usr/local/Pioneer/data
          cp -r assets/* deb/usr/local/Pioneer/data/
          mkdir -p deb/usr/local/bin
          ln -sf ../Pioneer/pioneer deb/usr/local/bin/pioneer
          chmod -R a+rwx deb/usr/local/Pioneer/share/julia

          # The GUI is optional: if its build was skipped or failed above, the
          # package is still produced, just without it.
          GUI_DEPENDS=""
          GUI_BIN="gui/src-tauri/target/release/pioneer-console"
          if [[ -f "$GUI_BIN" ]]; then
            install -Dm755 "$GUI_BIN" deb/usr/local/Pioneer/bin/pioneer-gui
            ln -sf ../Pioneer/bin/pioneer-gui deb/usr/local/bin/pioneer-gui
            install -Dm644 gui/src-tauri/icons/icon.png \
              deb/usr/share/icons/hicolor/512x512/apps/pioneer.png
            mkdir -p deb/usr/share/applications
            cat <<'DESKTOP' > deb/usr/share/applications/pioneer.desktop
          [Desktop Entry]
          Type=Application
          Name=Pioneer
          Comment=Search and quantify DIA proteomics data
          Exec=/usr/local/Pioneer/bin/pioneer-gui
          Icon=pioneer
          Terminal=false
          Categories=Science;Biology;
          DESKTOP
            # Only declared when the GUI is actually shipped, so a CLI-only
            # package stays dependency-free as it is today.
            GUI_DEPENDS="libwebkit2gtk-4.1-0, libgtk-3-0"
            echo "GUI included in .deb"
          else
            echo "GUI binary not found at $GUI_BIN - packaging CLI only"
          fi
          info=src/build/package_info.json
          RAW_VERSION='${{ steps.get_version.outputs.version }}'
          BASE_PACKAGE=$(jq -r '.package' $info)
          PACKAGE="$BASE_PACKAGE"
          MAINTAINER=$(jq -r '.maintainer' $info)
          DESCRIPTION=$(jq -r '.description' $info)
          DEB_VERSION='${{ steps.norm.outputs.deb }}'
          if [[ "$RAW_VERSION" == dev-* ]]; then
            PACKAGE="${BASE_PACKAGE}-dev"
            CONFLICTS="$BASE_PACKAGE"
            REPLACES="$BASE_PACKAGE"
          else
            CONFLICTS="${BASE_PACKAGE}-dev"
            REPLACES="${BASE_PACKAGE}-dev"
          fi

          mkdir -p deb/DEBIAN
          cat <<EOF > deb/DEBIAN/control
          Package: $PACKAGE
          Version: $DEB_VERSION
          Architecture: amd64
          Maintainer: $MAINTAINER
          Provides: $BASE_PACKAGE
          Conflicts: $CONFLICTS
          Replaces: $REPLACES
          Description: $DESCRIPTION
          EOF

          if [[ -n "$GUI_DEPENDS" ]]; then
            sed -i "/^Description:/i Depends: $GUI_DEPENDS" deb/DEBIAN/control
          fi

          dpkg-deb --build --root-owner-group deb \
            Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.deb

      - name: Upload .deb
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package_installer
        uses: actions/upload-artifact@v7
        with:
          name: Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}-deb
          path: Pioneer-${{ steps.get_version.outputs.version }}-${{ matrix.identifier }}.deb
          retention-days: ${{ inputs.artifact_retention_days }}
