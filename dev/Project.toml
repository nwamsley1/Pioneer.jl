[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
DocumenterTools = "35a29f4d-8980-5a13-9543-d66fff28ecb8"
PProf = "e4faabce-9ead-11e9-39d9-4379958e3056"
PackageCompiler = "9b87118b-4619-50d2-8e1e-99f35a4d4d9d"
Pioneer = "585db54e-1982-41c9-ae07-9e9eb56c7d61"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
Revise = "295af30f-e4ad-537b-8983-00126c2a3abe"

[compat]
Documenter = "1.5"
DocumenterTools = "0.1"
PProf = "3.2.0"
# Was pinned to "=2.2.3", which cannot produce a working binary on Julia >= 1.12: the app entry
# point it generates assigns `Base.PROGRAM_FILE`, and 1.12 reinstated the check that forbids
# assigning an undeclared global (JuliaLang/julia#56933). The binary builds and then dies at
# startup with "Global Base.PROGRAM_FILE does not exist and cannot be assigned."
PackageCompiler = "2.4"
# Tracks the main Project.toml, which requires 1.12.5. This said "1.11" while the package itself
# had moved to 1.12.5 (6bab0dadb), so the build workflows installed a Julia that could not resolve
# Pioneer at all.
julia = "1.12.5"

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test"]
